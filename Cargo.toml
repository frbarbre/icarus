[workspace]
resolver = "3"
members = ["crates/*"]
# The client is a Zed fork with its own workspace and toolchain.
exclude = ["app"]

[workspace.package]
version = "0.2.10"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/frbarbre/icarus"
# The client crates also build inside the Zed fork, which pins an older toolchain.
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"
