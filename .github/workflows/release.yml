name: release

# Builds a release and publishes it to this repository's GitHub releases, which is where
# `icarus update` and the Homebrew cask look. Unsigned on purpose (no Apple Developer account):
# the app is ad-hoc signed and installs its own updates (crates/icarus-cli/src/update.rs).
#
# Runs only on `v*` tags and by hand: private repositories pay 10x for macOS minutes.
#
#   git tag v0.2.0 && git push origin v0.2.0
#   gh workflow run release.yml -f version=0.2.0

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v, e.g. 0.2.0; tag v<version> is created on the selected ref'
        required: true
        type: string
      intel_app:
        description: 'Also build the Intel (x86_64) app bundle; doubles the macOS minutes'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  meta:
    name: resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      app-matrix: ${{ steps.version.outputs.app-matrix }}
    steps:
      - id: version
        env:
          REQUESTED: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          INTEL_APP: ${{ inputs.intel_app || false }}
        run: |
          set -euo pipefail
          version="${REQUESTED#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$REQUESTED' is not a semver version like 0.2.0 or 0.2.0-rc.1"
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          targets='"aarch64-apple-darwin"'
          if [ "$INTEL_APP" = "true" ]; then targets="$targets,\"x86_64-apple-darwin\""; fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
            echo "app-matrix=[$targets]"
          } >> "$GITHUB_OUTPUT"

  # The CLI and server. Linux uses glibc on native runners: no cross toolchain for the C in
  # SQLite and ring, and Ubuntu 22.04's glibc 2.35 still covers every supported distro.
  binaries:
    name: binaries (${{ matrix.target }})
    needs: meta
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: universal-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ICARUS_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.target }}
      - name: Build
        run: |
          set -euo pipefail
          name="icarus-$ICARUS_VERSION-${{ matrix.target }}"
          mkdir -p "dist/$name"
          bins=(--package icarus-cli --package icarus-server --bin icarus --bin icarus-server)
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            cargo build --release --locked "${bins[@]}" --target aarch64-apple-darwin --target x86_64-apple-darwin
            for bin in icarus icarus-server; do
              lipo -create -output "dist/$name/$bin" \
                "target/aarch64-apple-darwin/release/$bin" "target/x86_64-apple-darwin/release/$bin"
            done
          else
            cargo build --release --locked "${bins[@]}"
            cp target/release/icarus target/release/icarus-server "dist/$name/"
          fi
          strip -x "dist/$name/icarus" "dist/$name/icarus-server"
          "dist/$name/icarus-server" --version
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*.tar.gz
          retention-days: 7
          if-no-files-found: error

  # The Zed fork with the CLI and server inside, ad-hoc signed. The target dir is far over the
  # 10 GB cache limit, so only the cargo registry is cached.
  app-macos:
    name: app (${{ matrix.target }})
    needs: [meta, binaries]
    strategy:
      fail-fast: true
      matrix:
        target: ${{ fromJSON(needs.meta.outputs.app-matrix) }}
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf "${ANDROID_HOME:-/nonexistent}" ~/Library/Android /Users/runner/.dotnet /usr/local/share/dotnet || true
          xcrun simctl delete all || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches || true
          df -h /
      - name: Make sure the Metal compiler is installed
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app
          shared-key: release-app-${{ matrix.target }}
          cache-targets: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-universal-apple-darwin
          path: binaries
      - name: Bundle
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          tar -xzf "binaries/icarus-$VERSION-universal-apple-darwin.tar.gz" -C binaries
          scripts/release/bundle-mac.sh "${{ matrix.target }}" "$VERSION" \
            "binaries/icarus-$VERSION-universal-apple-darwin" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.dmg
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish
    needs: [meta, binaries, app-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Recreate rather than append, so a re-run leaves no stale assets on the tag.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          flags=(--latest)
          if [ "$PRERELEASE" = "true" ]; then flags=(--prerelease --latest=false); fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Icarus $VERSION" \
            --generate-notes \
            "${flags[@]}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha256sums
          path: dist/SHA256SUMS
          retention-days: 7

  homebrew:
    name: update the Homebrew cask
    needs: [meta, publish]
    if: needs.meta.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/release/homebrew
          path: icarus
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sha256sums
      - name: Write the cask into frbarbre/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          asset="Icarus-$VERSION-macos-aarch64.zip"
          sha=$(awk -v name="$asset" '$2 == name { print $1 }' SHA256SUMS)
          if [ -z "$sha" ]; then
            echo "::error::SHA256SUMS has no $asset"
            exit 1
          fi
          if [ -n "$TAP_TOKEN" ]; then
            auth=$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)
            echo "::add-mask::$auth"
            git -c http.extraheader="AUTHORIZATION: basic $auth" clone --depth 1 https://github.com/frbarbre/homebrew-tap.git tap
            git -C tap config http.extraheader "AUTHORIZATION: basic $auth"
          elif [ -n "$TAP_DEPLOY_KEY" ]; then
            key="$RUNNER_TEMP/tap_key"
            printf '%s\n' "$TAP_DEPLOY_KEY" > "$key"
            chmod 600 "$key"
            export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            git clone --depth 1 git@github.com:frbarbre/homebrew-tap.git tap
          else
            echo "::notice title=Homebrew cask not updated::Set TAP_TOKEN (a fine-grained token with Contents write on frbarbre/homebrew-tap) or TAP_DEPLOY_KEY on frbarbre/icarus."
            exit 0
          fi
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$sha/" icarus/scripts/release/homebrew/icarus.rb > tap/Casks/icarus.rb
          cp icarus/scripts/release/homebrew/README.md tap/README.md
          cd tap
          git add -A
          if git diff --cached --quiet; then
            echo "The tap already has icarus $VERSION."
            exit 0
          fi
          git diff --cached
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "icarus $VERSION"
          git push origin HEAD
          rm -f "$RUNNER_TEMP/tap_key"
