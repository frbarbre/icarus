name: app

on:
  push:
    branches: [main]
    paths: [app/**, crates/icarus-client/**, crates/icarus-protocol/**, crates/icarus-settings/**, Cargo.toml, .github/workflows/app.yml]
  pull_request:
    paths: [app/**, crates/icarus-client/**, crates/icarus-protocol/**, crates/icarus-settings/**, Cargo.toml, .github/workflows/app.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_BACKTRACE: '1'

defaults:
  run:
    working-directory: app

# No disk cleanup: hosted runners start with ~88 GB (Linux) and ~45 GB (macOS) free and these builds peak
# under 20 GB, while the cleanup steps cost 1-4 minutes per job.
jobs:
  test:
    name: tests (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./script/linux
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app -> target
          shared-key: app-test-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p icarus_ui -p title_bar -p agent_ui -p git_ui -p project_panel
      - run: cargo test -p workspace --features test-support --lib
      - run: df -h /
        if: always()

  zed:
    name: zed crate tests (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./script/linux
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app -> target
          shared-key: app-zed-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Upstream's session-restore tests are timing-sensitive; retries absorb their flakes.
      - run: cargo nextest run -p zed --no-fail-fast --retries 2
      - run: df -h /
        if: always()

  clippy:
    name: clippy (macos)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app -> target
          shared-key: app-clippy-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p icarus_ui -p agent_ui -p workspace -p title_bar -p zed --all-targets -- -D warnings
      - run: df -h /
        if: always()

  visual:
    name: visual tests (macos)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app -> target
          shared-key: app-visual-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # A baseline mismatch fails the job after a complete build; keep that build.
          cache-on-failure: true
      - run: cargo build -p zed --bin zed-visual-test-runner --features visual-tests
      - run: cargo run -p zed --bin zed-visual-test-runner --features visual-tests
        env:
          ICARUS_VISUAL_ONLY: '1'
          VISUAL_TEST_OUTPUT_DIR: ${{ github.workspace }}/app/target/visual_tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: visual-tests
          path: app/target/visual_tests
          retention-days: 7
          if-no-files-found: ignore
      - run: df -h /
        if: always()
