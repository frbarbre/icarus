name: app

on:
  push:
    branches: [main]
    paths: [app/**, crates/icarus-client/**, crates/icarus-protocol/**, crates/icarus-settings/**, Cargo.toml, .github/workflows/app.yml]
  pull_request:
    paths: [app/**, crates/icarus-client/**, crates/icarus-protocol/**, crates/icarus-settings/**, Cargo.toml, .github/workflows/app.yml]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      zed-suite:
        description: Also run the full zed crate test suite
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_BACKTRACE: '1'

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: tests (linux)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true
          swap-storage: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./script/linux
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app -> target
          shared-key: app-test-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p icarus_ui -p title_bar -p agent_ui -p git_ui -p project_panel
      - run: cargo test -p workspace --features test-support --lib
      - run: df -h /
        if: always()

  clippy:
    name: clippy (macos)
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          df -h /
          xcrun simctl delete all || true
          sudo rm -rf ~/Library/Android /Library/Developer/CoreSimulator/Profiles/Runtimes "$RUNNER_TOOL_CACHE" /usr/local/share/dotnet ~/.dotnet || true
          df -h /
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app -> target
          shared-key: app-clippy-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p icarus_ui -p agent_ui -p workspace -p title_bar -p zed --all-targets -- -D warnings
      - run: df -h /
        if: always()

  visual:
    name: visual tests (macos)
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          df -h /
          xcrun simctl delete all || true
          sudo rm -rf ~/Library/Android /Library/Developer/CoreSimulator/Profiles/Runtimes "$RUNNER_TOOL_CACHE" /usr/local/share/dotnet ~/.dotnet || true
          df -h /
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app -> target
          shared-key: app-visual-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: xcrun -sdk macosx metal --version
      # The dark baselines follow the system appearance once One Light is registered; runners default to light.
      - run: defaults write -g AppleInterfaceStyle Dark
      - run: cargo build -p zed --bin zed-visual-test-runner --features visual-tests
      - run: cargo run -p zed --bin zed-visual-test-runner --features visual-tests
        env:
          ICARUS_VISUAL_ONLY: '1'
          VISUAL_TEST_OUTPUT_DIR: ${{ github.workspace }}/app/target/visual_tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: visual-tests
          path: app/target/visual_tests
          retention-days: 7
          if-no-files-found: ignore
      - run: df -h /
        if: always()

  zed:
    name: zed crate tests (linux)
    if: github.event_name == 'schedule' || inputs.zed-suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true
          swap-storage: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./script/linux
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app -> target
          shared-key: app-zed-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Upstream's session-restore tests are timing-sensitive; retries absorb their flakes.
      - run: cargo nextest run -p zed --no-fail-fast --retries 2
      - run: df -h /
        if: always()
