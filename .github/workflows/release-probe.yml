name: release probe

# Temporary: checks whether this repository's Actions token may create releases.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create and delete a throwaway pre-release
        run: |
          set -euo pipefail
          echo hello > probe.txt
          gh release create "probe-${GITHUB_RUN_ID}" probe.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title probe --prerelease --latest=false
          gh release delete "probe-${GITHUB_RUN_ID}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
