name: release publish

# Publishes a release from the files an earlier release run already built, without rebuilding.
# Use it when only the publish step failed:
#
#   gh workflow run release-publish.yml -f version=0.1.0 -f run_id=<release run id>

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v, e.g. 0.1.0; tag v<version> must already exist'
        required: true
        type: string
      run_id:
        description: 'The release run whose built files to publish'
        required: true
        type: string

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}
  TAG: v${{ inputs.version }}

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Checksums
        working-directory: dist
        run: |
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Prints the API exchange, so a refusal says which call and why.
          GH_DEBUG: api
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .ref
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          flags=(--latest)
          case "$VERSION" in *-*) flags=(--prerelease --latest=false) ;; esac
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Icarus $VERSION" \
            --generate-notes \
            "${flags[@]}" 2>&1 | grep -vi "authorization"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha256sums
          path: dist/SHA256SUMS
          retention-days: 7

  homebrew:
    name: update the Homebrew cask
    needs: publish
    if: ${{ !contains(inputs.version, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/release/homebrew
          path: icarus
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sha256sums
      - name: Write the cask into frbarbre/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          asset="Icarus-$VERSION-macos-aarch64.zip"
          sha=$(awk -v name="$asset" '$2 == name { print $1 }' SHA256SUMS)
          if [ -z "$sha" ]; then
            echo "::error::SHA256SUMS has no $asset"
            exit 1
          fi
          if [ -n "$TAP_TOKEN" ]; then
            auth=$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)
            echo "::add-mask::$auth"
            git -c http.extraheader="AUTHORIZATION: basic $auth" clone --depth 1 https://github.com/frbarbre/homebrew-tap.git tap
            git -C tap config http.extraheader "AUTHORIZATION: basic $auth"
          elif [ -n "$TAP_DEPLOY_KEY" ]; then
            key="$RUNNER_TEMP/tap_key"
            printf '%s\n' "$TAP_DEPLOY_KEY" > "$key"
            chmod 600 "$key"
            export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            git clone --depth 1 git@github.com:frbarbre/homebrew-tap.git tap
          else
            echo "::notice title=Homebrew cask not updated::Set TAP_TOKEN or TAP_DEPLOY_KEY on frbarbre/icarus."
            exit 0
          fi
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$sha/" icarus/scripts/release/homebrew/icarus.rb > tap/Casks/icarus.rb
          cp icarus/scripts/release/homebrew/README.md tap/README.md
          cd tap
          git add -A
          if git diff --cached --quiet; then
            echo "The tap already has icarus $VERSION."
            exit 0
          fi
          git diff --cached
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "icarus $VERSION"
          git push origin HEAD
          rm -f "$RUNNER_TEMP/tap_key"
