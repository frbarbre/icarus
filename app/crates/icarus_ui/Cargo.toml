[package]
name = "icarus_ui"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/icarus_ui.rs"

[dependencies]
acp_thread.workspace = true
agent_servers.workspace = true
anyhow.workspace = true
buffer_diff.workspace = true
collections.workspace = true
db.workspace = true
file_icons.workspace = true
futures.workspace = true
fuzzy.workspace = true
git.workspace = true
gpui = { workspace = true, features = ["frame-capture"] }
menu.workspace = true
gpui_tokio.workspace = true
image.workspace = true
icarus-client = { path = "../../../crates/icarus-client" }
icarus-protocol = { path = "../../../crates/icarus-protocol" }
icarus-settings = { path = "../../../crates/icarus-settings" }
editor.workspace = true
extension_host.workspace = true
git_ui.workspace = true
language.workspace = true
log.workspace = true
multi_buffer.workspace = true
paths.workspace = true
picker.workspace = true
project.workspace = true
recent_projects.workspace = true
remote.workspace = true
schemars.workspace = true
task.workspace = true
terminal.workspace = true
terminal_view.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
ui.workspace = true
util.workspace = true
workspace.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSBitmapImageRep",
    "NSDockTile",
    "NSImage",
    "NSImageRep",
    "NSResponder",
    "NSSound",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "std",
    "NSData",
    "NSDictionary",
    "NSError",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "WKSnapshotConfiguration",
    "WKWebView",
] }
wry = { version = "0.57", default-features = false }

[dev-dependencies]
db = { workspace = true, features = ["test-support"] }
fs = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
remote_connection = { workspace = true, features = ["test-support"] }
recent_projects = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
theme.workspace = true
theme_settings.workspace = true
workspace = { workspace = true, features = ["test-support"] }
