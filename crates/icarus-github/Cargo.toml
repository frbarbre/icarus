[package]
name = "icarus-github"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
icarus-rules = { version = "0.1.0", path = "../icarus-rules" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "io-util", "time"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = [
  "full",
  "macros",
  "rt",
  "rt-multi-thread",
] }
