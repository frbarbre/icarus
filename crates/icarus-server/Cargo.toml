[package]
name = "icarus-server"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "icarus-server"
path = "src/main.rs"

[[bin]]
name = "icarus-fake-agent"
path = "src/bin/icarus-fake-agent.rs"
test = false

[[bin]]
name = "icarus-fake-codex"
path = "src/bin/icarus-fake-codex.rs"
test = false

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
filedescriptor = "0.8.3"
icarus-git = { path = "../icarus-git" }
icarus-github = { path = "../icarus-github" }
icarus-linear = { path = "../icarus-linear" }
icarus-protocol = { path = "../icarus-protocol" }
icarus-rules = { path = "../icarus-rules" }
icarus-settings = { path = "../icarus-settings" }
indexmap = "2.14.2"
portable-pty = "0.9.0"
rcgen = { version = "0.14.10", default-features = false, features = [
  "crypto",
  "ring",
  "pem",
] }
regex = "1.13.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustix = { version = "1.1.6", features = [
  "event",
  "net",
  "pipe",
  "process",
  "termios",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
] }
rustls-native-certs = "0.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "tls12",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.2", default-features = false, features = [
  "rustls-no-provider",
] }
uuid = { version = "1.29.2", features = ["v4"] }
yaml-rust2 = "0.13.0"

[lints]
workspace = true

[dev-dependencies]
icarus-client = { path = "../icarus-client" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full", "test-util"] }
